<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Bluebub</title>
    <link rel="icon" type="image/png" href="image/logonew.png">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/navbar.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lato', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding-top: 80px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .edit-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
        }

        .card-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
        }

        .card-header h1 {
            color: #2c3e50;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            color: #4a5568;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Lato', sans-serif;
            transition: all 0.3s;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            text-align: center;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #f7fafc;
        }

        .btn:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-error {
            background: #fed7d7;
            color: #c53030;
            border: 1px solid #fc8181;
        }

        .alert-success {
            background: #c6f6d5;
            color: #2f855a;
            border: 1px solid #9ae6b4;
        }

        @media (max-width: 768px) {
            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar" id="navbar">
    <a href="/" class="navbar-brand">
        <img src="/image/logonew.png" class="navbar-logo" alt="Bluebub Logo">
        <span class="brand-text">Bluebub</span>
    </a>
    
    <div class="navbar-menu">
        <a href="/" class="nav-link">Beranda</a>

        <a href="/ai.html" class="nav-link">Peta</a>
        <a href="/ai.html" class="nav-link">Marketplace</a>
        <a href="/ai.html" class="nav-link">AI Kolaborasi</a>
        <a href="/ai.html" class="nav-link">Statistik</a>

        <a href="#" class="nav-link">Diskusi</a>
        
                    <div class="nav-link profile-btn" id="auth-links"></div>

    </div>
    
    <div class="navbar-toggle" id="navbar-toggle">
        <span></span>
        <span></span>
        <span></span>
    </div>
</nav>

    <div class="container">
        <div class="edit-card">
            <div class="card-header">
                <h1>Edit Profile</h1>
            </div>

            <div id="alert" class="alert"></div>

            <form id="editProfileForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="alamat">Address</label>
                    <textarea id="alamat" name="alamat" placeholder="Enter your address"></textarea>
                </div>

                <div class="form-group">
                    <label for="nomor_telepon">Phone Number</label>
                    <input type="tel" id="nomor_telepon" name="nomor_telepon" placeholder="ex: +62 812 3456 7890">
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary" id="saveBtn">Save Changes</button>
                    <a href="profile.html" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        // Check if logged in
        const token = localStorage.getItem('bluebub_token');
        if (!token) {
            window.location.href = 'login.html';
        }

        // Load current profile data
        async function loadCurrentProfile() {
            try {
                const response = await fetch(`${API_URL}/auth/me`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (data.success) {
                    const user = data.user;
                    document.getElementById('name').value = user.name || '';
                    document.getElementById('alamat').value = user.alamat || '';
                    document.getElementById('nomor_telepon').value = user.nomor_telepon || '';
                }
            } catch (error) {
                console.error('Load profile error:', error);
            }
        }

        // Update profile
        document.getElementById('editProfileForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const alamat = document.getElementById('alamat').value;
            const nomor_telepon = document.getElementById('nomor_telepon').value;
            const saveBtn = document.getElementById('saveBtn');
            const alert = document.getElementById('alert');

            // Disable button
            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';
            alert.style.display = 'none';

            try {
                const response = await fetch(`${API_URL}/auth/update-profile`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, alamat, nomor_telepon })
                });

                const data = await response.json();

                if (data.success) {
                    // Update local storage
                    localStorage.setItem('bluebub_user', JSON.stringify(data.user));

                    // Show success message
                    alert.className = 'alert alert-success';
                    alert.textContent = 'Profile updated successfully!';
                    alert.style.display = 'block';

                    // Redirect after delay
                    setTimeout(() => {
                        window.location.href = 'profile.html';
                    }, 1500);
                } else {
                    alert.className = 'alert alert-error';
                    alert.textContent = data.message || 'Update failed';
                    alert.style.display = 'block';
                    saveBtn.disabled = false;
                    saveBtn.textContent = 'Save Changes';
                }
            } catch (error) {
                console.error('Update error:', error);
                alert.className = 'alert alert-error';
                alert.textContent = 'Network error. Please try again.';
                alert.style.display = 'block';
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save Changes';
            }
        });

        // Load profile on page load
        loadCurrentProfile();
    </script>

    <script src="js/navbar.js"></script>
</body>
</html>
