<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Bluebub</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/slider.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f8f9fa 0%, #e3f2fd 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 5%;
        }

        .profile-card {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 2px solid #e0e0e0;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #40e0d0, #088395);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 3rem;
            color: white;
        }

        .profile-header h1 {
            color: #05445e;
            margin-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: #05445e;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
        }

        .form-group input:focus, 
        .form-group textarea:focus {
            outline: none;
            border-color: #088395;
        }

        .btn-save {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #40e0d0, #088395);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-save:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(8, 131, 149, 0.4);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <img src="/image/logonew.png" class="navbar-logo" alt="Bluebub Logo">
            <span class="brand-text">Bluebub</span>
        </a>
    </nav>

    <div class="container">
        <div class="profile-card">
            <div class="profile-header">
                <div class="profile-avatar">👤</div>
                <h1 id="profile-username">User Profile</h1>
                <p id="profile-email" style="color: #666;"></p>
            </div>

            <form id="profile-form">
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Nama lengkap Anda">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label>Nomor Telepon</label>
                    <input type="tel" id="phone" name="phone" placeholder="08xxxxxxxxxx">
                </div>

                <div class="form-group">
                    <label>Alamat Lengkap</label>
                    <textarea id="address" name="address" rows="3" placeholder="Alamat lengkap untuk pengiriman"></textarea>
                </div>

                <div class="form-group">
                    <label>Kota</label>
                    <input type="text" id="city" name="city" placeholder="Nama kota">
                </div>

                <div class="form-group">
                    <label>Provinsi</label>
                    <input type="text" id="province" name="province" placeholder="Nama provinsi">
                </div>

                <div class="form-group">
                    <label>Kode Pos</label>
                    <input type="text" id="postalCode" name="postalCode" placeholder="12345">
                </div>

                <div class="button-group">
                    <a href="edit-profile.html" class="btn btn-primary">Edit Profile</a>
                    <a href="index.html" class="btn btn-secondary">Back to Home</a>
                    <button onclick="logout()" class="btn btn-logout">Logout</button>
                </div>

                <button type="submit" class="btn-save">💾 Simpan Profile</button>
            </form>
        </div>
    </div>

    <script>
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', function() {
            loadUserProfile();
        });

        function loadUserProfile() {
            const userData = localStorage.getItem('bluebub_user');
            
            if (!userData) {
                alert('Silakan login terlebih dahulu');
                window.location.href = 'login.html';
                return;
            }

            currentUser = JSON.parse(userData);

            // Display current user data
            document.getElementById('profile-username').textContent = currentUser.username;
            document.getElementById('profile-email').textContent = currentUser.email;

            // Fill form with existing data
            document.getElementById('fullName').value = currentUser.fullName || '';
            document.getElementById('email').value = currentUser.email || '';
            document.getElementById('phone').value = currentUser.phone || '';
            document.getElementById('address').value = currentUser.address || '';
            document.getElementById('city').value = currentUser.city || '';
            document.getElementById('province').value = currentUser.province || '';
            document.getElementById('postalCode').value = currentUser.postalCode || '';
        }

        document.getElementById('profile-form').addEventListener('submit', function(e) {
            e.preventDefault();

            // Update user data
            currentUser.fullName = document.getElementById('fullName').value;
            currentUser.email = document.getElementById('email').value;
            currentUser.phone = document.getElementById('phone').value;
            currentUser.address = document.getElementById('address').value;
            currentUser.city = document.getElementById('city').value;
            currentUser.province = document.getElementById('province').value;
            currentUser.postalCode = document.getElementById('postalCode').value;

            // Save to localStorage
            localStorage.setItem('bluebub_user', JSON.stringify(currentUser));

            alert('✅ Profile berhasil diupdate!');
        });
    </script>
    <script src="js/auth.js"></script>
    <script src="js/sweetalert-helper.js"></script>
    <script src="js/navbar.js"></script>
</body>
</html>
